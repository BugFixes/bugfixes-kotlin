name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build
        run: ./gradlew build  # the runner image ships the Android SDK (ANDROID_HOME)
      - name: Run tests
        run: ./gradlew test
      - name: Publish to Maven Central
        # separate runs: in one, Gradle may zip the stage before it's filled
        run: |
          ./gradlew publishAllPublicationsToMavenStageRepository
          ./gradlew publishToMavenCentral
        env:
          SIGNING_SETUP: ${{ secrets.MAVEN_CENTRAL_PUBLISH_GPG }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLISH_USER: ${{ secrets.MAVEN_USERNAME }}
